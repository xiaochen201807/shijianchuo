# ============================================================
# Nginx 配置 - RFC 3161 TSA 反向代理
#
# 将 HTTP/HTTPS 请求转发至 fcgiwrap (FastCGI)
# fcgiwrap 再执行 CGI 脚本处理时间戳请求
# ============================================================

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # --- 基础配置 ---
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- 日志格式 ---
    log_format main '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_user_agent" $request_time '
                     'upstream:$upstream_addr '
                     'upstream_status:$upstream_status '
                     'upstream_time:$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # --- 性能优化 ---
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # --- 请求大小限制 (允许较大的时间戳请求) ---
    client_max_body_size 10m;
    client_body_buffer_size 256k;

    # --- FastCGI 超时设置 ---
    fastcgi_connect_timeout 30s;
    fastcgi_send_timeout    60s;
    fastcgi_read_timeout    60s;
    fastcgi_buffer_size     64k;
    fastcgi_buffers         4 64k;
    fastcgi_busy_buffers_size 128k;

    # --- 上游服务器 (TSA fcgiwrap) ---
    upstream tsa_fcgi {
        server tsa:9000;
        keepalive 8;
    }

    # ============================================================
    # HTTP 服务器 (端口 80)
    # ============================================================
    server {
        listen 80;
        server_name _;

        # --- 健康检查端点 ---
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        # --- TSA 时间戳请求端点 (核心) ---
        # RFC 3161: Content-Type: application/timestamp-query
        location = /tsa {
            # 仅允许 POST 方法
            limit_except POST {
                deny all;
            }

            # FastCGI 参数 - 转发至 fcgiwrap
            fastcgi_pass tsa_fcgi;

            # CGI 脚本路径
            fastcgi_param SCRIPT_FILENAME /var/www/tsa/tsa_cgi.sh;

            # 标准 FastCGI 参数
            fastcgi_param  REQUEST_METHOD     $request_method;
            fastcgi_param  CONTENT_TYPE       $content_type;
            fastcgi_param  CONTENT_LENGTH     $content_length;
            fastcgi_param  QUERY_STRING       $query_string;
            fastcgi_param  REQUEST_URI        $request_uri;
            fastcgi_param  DOCUMENT_URI       $document_uri;
            fastcgi_param  DOCUMENT_ROOT      $document_root;
            fastcgi_param  SERVER_PROTOCOL    $server_protocol;
            fastcgi_param  GATEWAY_INTERFACE  CGI/1.1;
            fastcgi_param  SERVER_SOFTWARE    nginx;
            fastcgi_param  REMOTE_ADDR        $remote_addr;
            fastcgi_param  REMOTE_PORT        $remote_port;
            fastcgi_param  SERVER_ADDR        $server_addr;
            fastcgi_param  SERVER_PORT        $server_port;
            fastcgi_param  SERVER_NAME        $server_name;
            fastcgi_param  HTTPS              off;

            # FastCGI 优化
            fastcgi_keep_conn on;
            fastcgi_intercept_errors off;
        }

        # --- 获取 TSA 证书端点 ---
        # 允许客户端下载 TSA 证书用于验证
        location = /tsa/cert {
            root /etc/nginx/tsa-certs;
            try_files /tsacert.pem =404;
            add_header Content-Type application/x-x509-ca-cert;
            add_header Content-Disposition 'attachment; filename="tsacert.pem"';
        }

        # --- 获取 CA 证书端点 ---
        location = /tsa/cacert {
            root /etc/nginx/tsa-certs;
            try_files /cacert.pem =404;
            add_header Content-Type application/x-x509-ca-cert;
            add_header Content-Disposition 'attachment; filename="cacert.pem"';
        }

        # --- 服务器信息端点 ---
        location = /info {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"service":"TSA","version":"1.0","algorithms":["SM2","SM3"],"rfc":"3161"}';
        }
    }

    # ============================================================
    # HTTPS 服务器 (端口 443) - 生产推荐
    # ============================================================
    server {
        listen 443 ssl;
        server_name _;

        # TLS 证书 (传输层加密，与 SM2 签名证书分离，目录可写)
        ssl_certificate     /etc/nginx/tls/tls_cert.pem;
        ssl_certificate_key /etc/nginx/tls/tls_key.pem;

        # TLS 安全配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # --- 健康检查 ---
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        # --- TSA 时间戳请求端点 ---
        location = /tsa {
            limit_except POST {
                deny all;
            }

            fastcgi_pass tsa_fcgi;
            fastcgi_param SCRIPT_FILENAME /var/www/tsa/tsa_cgi.sh;
            fastcgi_param  REQUEST_METHOD     $request_method;
            fastcgi_param  CONTENT_TYPE       $content_type;
            fastcgi_param  CONTENT_LENGTH     $content_length;
            fastcgi_param  QUERY_STRING       $query_string;
            fastcgi_param  REQUEST_URI        $request_uri;
            fastcgi_param  DOCUMENT_URI       $document_uri;
            fastcgi_param  DOCUMENT_ROOT      $document_root;
            fastcgi_param  SERVER_PROTOCOL    $server_protocol;
            fastcgi_param  GATEWAY_INTERFACE  CGI/1.1;
            fastcgi_param  SERVER_SOFTWARE    nginx;
            fastcgi_param  REMOTE_ADDR        $remote_addr;
            fastcgi_param  REMOTE_PORT        $remote_port;
            fastcgi_param  SERVER_ADDR        $server_addr;
            fastcgi_param  SERVER_PORT        $server_port;
            fastcgi_param  SERVER_NAME        $server_name;
            fastcgi_param  HTTPS              on;

            fastcgi_keep_conn on;
            fastcgi_intercept_errors off;
        }

        # --- TSA 证书下载 ---
        location = /tsa/cert {
            root /etc/nginx/tsa-certs;
            try_files /tsacert.pem =404;
            add_header Content-Type application/x-x509-ca-cert;
        }

        location = /tsa/cacert {
            root /etc/nginx/tsa-certs;
            try_files /cacert.pem =404;
            add_header Content-Type application/x-x509-ca-cert;
        }
    }
}
