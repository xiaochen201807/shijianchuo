# ============================================================
# RFC 3161 国密 TSA 服务器 Docker Compose 一键部署
# 组件: GmSSL3 + nginx + fcgiwrap + chrony
# ============================================================

services:
  # ----------------------------------------------------------
  # 1. Chrony - NTP 时间同步服务
  #    确保 TSA 签发的时间戳精确可靠
  # ----------------------------------------------------------
  chrony:
    build:
      context: ./chrony
      dockerfile: Dockerfile
    container_name: tsa-chrony
    restart: always
    privileged: true
    cap_add:
      - SYS_TIME
    networks:
      tsa-net:
        aliases:
          - chrony
    volumes:
      - chrony-data:/var/lib/chrony
    healthcheck:
      test: ["CMD", "chronyc", "tracking"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------
  # 2. TSA Server - 时间戳服务核心
  #    包含: GmSSL3 + fcgiwrap + CGI 脚本 + 证书管理
  # ----------------------------------------------------------
  tsa-server:
    build:
      context: ./tsa-server
      dockerfile: Dockerfile
    container_name: tsa-server
    restart: always
    depends_on:
      chrony:
        condition: service_healthy
    networks:
      tsa-net:
        aliases:
          - tsa
    volumes:
      - tsa-certs:/etc/tsa/certs
      - tsa-serial:/var/lib/tsa
      - tsa-logs:/var/log/tsa
    environment:
      - TZ=Asia/Shanghai
      - TSA_POLICY_OID=${TSA_POLICY_OID:-1.2.3.4.1}
      - CA_COUNTRY=${CA_COUNTRY:-CN}
      - CA_STATE=${CA_STATE:-Beijing}
      - CA_LOCALITY=${CA_LOCALITY:-Beijing}
      - CA_ORG=${CA_ORG:-MyOrg}
      - CA_OU=${CA_OU:-TSA}
      - CA_CN=${CA_CN:-TSA Root CA}
      - TSA_CN=${TSA_CN:-TSA Server}
      - CERT_DAYS=${CERT_DAYS:-3650}
    healthcheck:
      test: ["CMD", "test", "-f", "/etc/tsa/certs/tsacert.pem"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ----------------------------------------------------------
  # 3. Nginx - 反向代理 + HTTPS 终端
  #    将 HTTP/HTTPS 请求转发至 fcgiwrap (FastCGI)
  # ----------------------------------------------------------
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: tsa-nginx
    restart: always
    depends_on:
      tsa-server:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    networks:
      tsa-net:
        aliases:
          - nginx
    volumes:
      # SM2 TSA/CA 证书 (只读，由 tsa-server 生成)
      - tsa-certs:/etc/nginx/tsa-certs:ro
      # TLS 传输层证书 (可写，由 nginx 自己生成，与 SM2 签名证书分离)
      - nginx-tls:/etc/nginx/tls
      - nginx-logs:/var/log/nginx
    environment:
      - TZ=Asia/Shanghai

volumes:
  tsa-certs:
    driver: local
  tsa-serial:
    driver: local
  tsa-logs:
    driver: local
  nginx-tls:
    driver: local
  nginx-logs:
    driver: local
  chrony-data:
    driver: local

networks:
  tsa-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
