# ============================================================
# 最终 All-in-One 镜像 (本地构建)
# 内含: Tongsuo TSA + nginx + chrony + tsa-demo 原生二进制 (无 JVM)
# ============================================================

services:
  tsa:
    build:
      context: .
      dockerfile: Dockerfile
    image: tsa-all-in-one:local
    container_name: tsa
    restart: always
    privileged: true
    cap_add:
      - SYS_TIME
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
      # 原生 Demo 直连 (也可走 8080/api)
      - "${DEMO_PORT:-9090}:9090"
    volumes:
      - tsa-certs:/etc/tsa/certs
      - tsa-data:/var/lib/tsa
      - tsa-logs:/var/log/tsa
      - nginx-logs:/var/log/nginx
      - nginx-tls:/etc/nginx/tls
      - chrony-data:/var/lib/chrony
    environment:
      - TZ=Asia/Shanghai
      - TSA_POLICY_OID=${TSA_POLICY_OID:-1.2.3.4.1}
      - CA_COUNTRY=${CA_COUNTRY:-CN}
      - CA_STATE=${CA_STATE:-Beijing}
      - CA_LOCALITY=${CA_LOCALITY:-Beijing}
      - CA_ORG=${CA_ORG:-MyOrg}
      - CA_OU=${CA_OU:-TSA}
      - CA_CN=${CA_CN:-TSA Root CA}
      - TSA_CN=${TSA_CN:-TSA Server}
      - CERT_DAYS=${CERT_DAYS:-3650}
      # Demo 默认访问容器内 TSA (supervisor 内已写死 127.0.0.1，此处可覆盖)
      - TSA_URL=${TSA_URL:-http://127.0.0.1/tsa}
      - SERVER_PORT=9090
    healthcheck:
      test: ["CMD", "/scripts/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  tsa-certs:
    driver: local
  tsa-data:
    driver: local
  tsa-logs:
    driver: local
  nginx-logs:
    driver: local
  nginx-tls:
    driver: local
  chrony-data:
    driver: local
