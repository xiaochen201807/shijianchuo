# ============================================================
# RFC 3161 国密 TSA — All-in-One 一键部署
# 单镜像: GmSSL3 + nginx + fcgiwrap + chrony
# ============================================================

services:
  tsa:
    build:
      context: .
      dockerfile: Dockerfile
    image: tsa-all-in-one:local
    container_name: tsa
    restart: always
    # chrony 校正系统时钟需要
    privileged: true
    cap_add:
      - SYS_TIME
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - tsa-certs:/etc/tsa/certs
      - tsa-data:/var/lib/tsa
      - tsa-logs:/var/log/tsa
      - nginx-logs:/var/log/nginx
      - nginx-tls:/etc/nginx/tls
      - chrony-data:/var/lib/chrony
    environment:
      - TZ=Asia/Shanghai
      - TSA_POLICY_OID=${TSA_POLICY_OID:-1.2.3.4.1}
      - CA_COUNTRY=${CA_COUNTRY:-CN}
      - CA_STATE=${CA_STATE:-Beijing}
      - CA_LOCALITY=${CA_LOCALITY:-Beijing}
      - CA_ORG=${CA_ORG:-MyOrg}
      - CA_OU=${CA_OU:-TSA}
      - CA_CN=${CA_CN:-TSA Root CA}
      - TSA_CN=${TSA_CN:-TSA Server}
      - CERT_DAYS=${CERT_DAYS:-3650}
    healthcheck:
      test: ["CMD", "/scripts/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  tsa-certs:
    driver: local
  tsa-data:
    driver: local
  tsa-logs:
    driver: local
  nginx-logs:
    driver: local
  nginx-tls:
    driver: local
  chrony-data:
    driver: local
