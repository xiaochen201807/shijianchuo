# ============================================================
# 拉取最终 All-in-One 镜像 (含原生 tsa-demo，无 JVM)
#
#   docker compose -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.ghcr.yml up -d
#
#   curl http://localhost:8080/health
#   curl "http://localhost:8080/api/sm3/hash?text=Hello"
#   curl -X POST http://localhost:8080/api/tsa/timestamp/text \
#     -H "Content-Type: application/json" -d '{"text":"hi"}'
# ============================================================

services:
  tsa:
    image: ghcr.io/${GHCR_OWNER:-xiaochen201807}/${GHCR_REPO:-shijianchuo}/tsa:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: tsa
    restart: always
    privileged: true
    cap_add:
      - SYS_TIME
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
      - "${DEMO_PORT:-9090}:9090"
    volumes:
      - tsa-certs:/etc/tsa/certs
      - tsa-data:/var/lib/tsa
      - tsa-logs:/var/log/tsa
      - nginx-logs:/var/log/nginx
      - nginx-tls:/etc/nginx/tls
      - chrony-data:/var/lib/chrony
    environment:
      - TZ=Asia/Shanghai
      - TSA_POLICY_OID=${TSA_POLICY_OID:-1.2.3.4.1}
      - CA_COUNTRY=${CA_COUNTRY:-CN}
      - CA_STATE=${CA_STATE:-Beijing}
      - CA_LOCALITY=${CA_LOCALITY:-Beijing}
      - CA_ORG=${CA_ORG:-MyOrg}
      - CA_OU=${CA_OU:-TSA}
      - CA_CN=${CA_CN:-TSA Root CA}
      - TSA_CN=${TSA_CN:-TSA Server}
      - CERT_DAYS=${CERT_DAYS:-3650}
    healthcheck:
      test: ["CMD", "/scripts/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  tsa-certs:
    driver: local
  tsa-data:
    driver: local
  tsa-logs:
    driver: local
  nginx-logs:
    driver: local
  nginx-tls:
    driver: local
  chrony-data:
    driver: local
