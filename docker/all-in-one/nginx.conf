# ============================================================
# All-in-One Nginx
#   /tsa      → tsa-server-java :9001 (Java 高性能 TSA)
#   /api/*    → tsa-demo 原生二进制 :9090 (无 JVM)
# ============================================================

worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_user_agent" $request_time';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens off;

    # 请求体限制
    client_max_body_size 128m;
    client_body_buffer_size 1m;

    # TSA Java Server (高性能 RFC 3161 签名，替代 CGI)
    upstream tsa_java {
        server 127.0.0.1:9001;
        keepalive 64;
    }

    # 原生 Demo (GraalVM binary)
    upstream tsa_demo {
        server 127.0.0.1:9090;
        keepalive 32;
    }

    # ---------------- HTTP :80 ----------------
    server {
        listen 80;
        server_name _;

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        location = /info {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"service":"TSA","version":"4.0","mode":"all-in-one","components":["tongsuo","nginx","tsa-server-java","chrony","tsa-demo-native"],"algorithms":["SM2","SM3"],"rfc":"3161","demo":"/api","signing":"java-native"}';
        }

        # RFC 3161 → Java TSA Server (高性能，无 CGI)
        location = /tsa {
            proxy_pass http://tsa_java;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Content-Type $content_type;
            proxy_set_header Content-Length $content_length;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_buffer_size 16k;
            proxy_buffers 2 16k;
            proxy_busy_buffers_size 16k;
        }

        location = /tsa/cert {
            alias /etc/tsa/certs/tsacert.pem;
            default_type application/x-x509-ca-cert;
            add_header Content-Disposition 'attachment; filename="tsacert.pem"';
        }

        location = /tsa/cacert {
            alias /etc/tsa/certs/cacert.pem;
            default_type application/x-x509-ca-cert;
            add_header Content-Disposition 'attachment; filename="cacert.pem"';
        }

        # 原生 Demo REST API (无 JVM)
        location /api/ {
            proxy_pass http://tsa_demo;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_buffer_size 256k;
            proxy_buffers 8 256k;
            proxy_busy_buffers_size 512k;
            proxy_max_temp_file_size 128m;
        }
    }

    # ---------------- HTTPS :443 ----------------
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/tls/tls_cert.pem;
        ssl_certificate_key /etc/nginx/tls/tls_key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        location = /info {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"service":"TSA","version":"4.0","mode":"all-in-one","components":["tongsuo","nginx","tsa-server-java","chrony","tsa-demo-native"],"algorithms":["SM2","SM3"],"rfc":"3161","demo":"/api","signing":"java-native"}';
        }

        # RFC 3161 → Java TSA Server
        location = /tsa {
            proxy_pass http://tsa_java;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Content-Type $content_type;
            proxy_set_header Content-Length $content_length;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_buffer_size 16k;
            proxy_buffers 2 16k;
            proxy_busy_buffers_size 16k;
        }

        location = /tsa/cert {
            alias /etc/tsa/certs/tsacert.pem;
            default_type application/x-x509-ca-cert;
        }

        location = /tsa/cacert {
            alias /etc/tsa/certs/cacert.pem;
            default_type application/x-x509-ca-cert;
        }

        location /api/ {
            proxy_pass http://tsa_demo;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_buffer_size 256k;
            proxy_buffers 8 256k;
            proxy_busy_buffers_size 512k;
            proxy_max_temp_file_size 128m;
        }
    }
}
