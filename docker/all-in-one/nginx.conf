# ============================================================
# All-in-One Nginx
#   /tsa      → fcgiwrap (RFC 3161)
#   /api/*    → tsa-demo 原生二进制 :9090 (无 JVM)
# ============================================================

worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_user_agent" $request_time';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens off;

    # 请求体限制：/tsa 端点只需几百字节，/api 端点可能传大文件
    client_max_body_size 128m;
    client_body_buffer_size 1m;  # 超过此值写临时文件

    # FastCGI (/tsa 端点) - 响应很小(~2KB)，配置紧凑即可
    fastcgi_connect_timeout 10s;
    fastcgi_send_timeout    30s;
    fastcgi_read_timeout    30s;
    fastcgi_buffer_size     16k;
    fastcgi_buffers         2 16k;
    fastcgi_busy_buffers_size 32k;
    fastcgi_max_temp_file_size 0;  # 禁止写临时文件，响应很小不需要

    upstream tsa_fcgi {
        server 127.0.0.1:9000;
        keepalive 32;
    }

    # 原生 Demo (GraalVM binary)
    upstream tsa_demo {
        server 127.0.0.1:9090;
        keepalive 32;
    }

    # ---------------- HTTP :80 ----------------
    server {
        listen 80;
        server_name _;

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        location = /info {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"service":"TSA","version":"3.0","mode":"all-in-one","components":["tongsuo","nginx","fcgiwrap","chrony","tsa-demo-native"],"algorithms":["SM2","SM3"],"rfc":"3161","demo":"/api","jvm":false}';
        }

        # RFC 3161 (精简 FastCGI 参数，减少开销)
        location = /tsa {
            limit_except POST { deny all; }

            fastcgi_pass tsa_fcgi;
            fastcgi_keep_conn on;

            # tsa_cgi.sh 仅需要这 3 个参数
            fastcgi_param SCRIPT_FILENAME /var/www/tsa/tsa_cgi.sh;
            fastcgi_param REQUEST_METHOD  $request_method;
            fastcgi_param CONTENT_TYPE    $content_type;
            fastcgi_param CONTENT_LENGTH  $content_length;
        }

        location = /tsa/cert {
            alias /etc/tsa/certs/tsacert.pem;
            default_type application/x-x509-ca-cert;
            add_header Content-Disposition 'attachment; filename="tsacert.pem"';
        }

        location = /tsa/cacert {
            alias /etc/tsa/certs/cacert.pem;
            default_type application/x-x509-ca-cert;
            add_header Content-Disposition 'attachment; filename="cacert.pem"';
        }

        # 原生 Demo REST API (无 JVM)
        location /api/ {
            proxy_pass http://tsa_demo;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;  # 大文件处理可能需要更长时间
            # 大文件场景 buffer
            proxy_buffer_size 256k;
            proxy_buffers 8 256k;
            proxy_busy_buffers_size 512k;
            proxy_max_temp_file_size 128m;  # 允许写临时文件处理大响应
        }
    }

    # ---------------- HTTPS :443 ----------------
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/tls/tls_cert.pem;
        ssl_certificate_key /etc/nginx/tls/tls_key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        location = /info {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"service":"TSA","version":"3.0","mode":"all-in-one","components":["tongsuo","nginx","fcgiwrap","chrony","tsa-demo-native"],"algorithms":["SM2","SM3"],"rfc":"3161","demo":"/api","jvm":false}';
        }

        # RFC 3161 (精简 FastCGI 参数，减少开销)
        location = /tsa {
            limit_except POST { deny all; }

            fastcgi_pass tsa_fcgi;
            fastcgi_keep_conn on;

            # tsa_cgi.sh 仅需要这 3 个参数
            fastcgi_param SCRIPT_FILENAME /var/www/tsa/tsa_cgi.sh;
            fastcgi_param REQUEST_METHOD  $request_method;
            fastcgi_param CONTENT_TYPE    $content_type;
            fastcgi_param CONTENT_LENGTH  $content_length;
        }

        location = /tsa/cert {
            alias /etc/tsa/certs/tsacert.pem;
            default_type application/x-x509-ca-cert;
        }

        location = /tsa/cacert {
            alias /etc/tsa/certs/cacert.pem;
            default_type application/x-x509-ca-cert;
        }

        location /api/ {
            proxy_pass http://tsa_demo;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;  # 大文件处理可能需要更长时间
            # 大文件场景 buffer
            proxy_buffer_size 256k;
            proxy_buffers 8 256k;
            proxy_busy_buffers_size 512k;
            proxy_max_temp_file_size 128m;  # 允许写临时文件处理大响应
        }
    }
}
