# ============================================================
# All-in-One Nginx
#   /tsa      → fcgiwrap (RFC 3161)
#   /api/*    → tsa-demo 原生二进制 :9090 (无 JVM)
# ============================================================

worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_user_agent" $request_time';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens off;

    client_max_body_size 10m;
    client_body_buffer_size 256k;

    fastcgi_connect_timeout 30s;
    fastcgi_send_timeout    60s;
    fastcgi_read_timeout    60s;
    fastcgi_buffer_size     64k;
    fastcgi_buffers         4 64k;
    fastcgi_busy_buffers_size 128k;

    upstream tsa_fcgi {
        server 127.0.0.1:9000;
        keepalive 8;
    }

    # 原生 Demo (GraalVM binary)
    upstream tsa_demo {
        server 127.0.0.1:9090;
        keepalive 8;
    }

    # ---------------- HTTP :80 ----------------
    server {
        listen 80;
        server_name _;

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        location = /info {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"service":"TSA","version":"3.0","mode":"all-in-one","components":["tongsuo","nginx","fcgiwrap","chrony","tsa-demo-native"],"algorithms":["SM2","SM3"],"rfc":"3161","demo":"/api","jvm":false}';
        }

        # RFC 3161
        location = /tsa {
            limit_except POST { deny all; }

            fastcgi_pass tsa_fcgi;
            fastcgi_param SCRIPT_FILENAME /var/www/tsa/tsa_cgi.sh;
            fastcgi_param REQUEST_METHOD  $request_method;
            fastcgi_param CONTENT_TYPE    $content_type;
            fastcgi_param CONTENT_LENGTH  $content_length;
            fastcgi_param QUERY_STRING    $query_string;
            fastcgi_param REQUEST_URI     $request_uri;
            fastcgi_param DOCUMENT_URI    $document_uri;
            fastcgi_param DOCUMENT_ROOT   $document_root;
            fastcgi_param SERVER_PROTOCOL $server_protocol;
            fastcgi_param GATEWAY_INTERFACE CGI/1.1;
            fastcgi_param SERVER_SOFTWARE nginx;
            fastcgi_param REMOTE_ADDR     $remote_addr;
            fastcgi_param REMOTE_PORT     $remote_port;
            fastcgi_param SERVER_ADDR     $server_addr;
            fastcgi_param SERVER_PORT     $server_port;
            fastcgi_param SERVER_NAME     $server_name;
            fastcgi_param HTTPS           off;
            fastcgi_keep_conn on;
            fastcgi_intercept_errors off;
        }

        location = /tsa/cert {
            alias /etc/tsa/certs/tsacert.pem;
            default_type application/x-x509-ca-cert;
            add_header Content-Disposition 'attachment; filename="tsacert.pem"';
        }

        location = /tsa/cacert {
            alias /etc/tsa/certs/cacert.pem;
            default_type application/x-x509-ca-cert;
            add_header Content-Disposition 'attachment; filename="cacert.pem"';
        }

        # 原生 Demo REST API (无 JVM)
        location /api/ {
            proxy_pass http://tsa_demo;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }
    }

    # ---------------- HTTPS :443 ----------------
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/tls/tls_cert.pem;
        ssl_certificate_key /etc/nginx/tls/tls_key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        location = /info {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"service":"TSA","version":"3.0","mode":"all-in-one","components":["tongsuo","nginx","fcgiwrap","chrony","tsa-demo-native"],"algorithms":["SM2","SM3"],"rfc":"3161","demo":"/api","jvm":false}';
        }

        location = /tsa {
            limit_except POST { deny all; }

            fastcgi_pass tsa_fcgi;
            fastcgi_param SCRIPT_FILENAME /var/www/tsa/tsa_cgi.sh;
            fastcgi_param REQUEST_METHOD  $request_method;
            fastcgi_param CONTENT_TYPE    $content_type;
            fastcgi_param CONTENT_LENGTH  $content_length;
            fastcgi_param QUERY_STRING    $query_string;
            fastcgi_param REQUEST_URI     $request_uri;
            fastcgi_param DOCUMENT_URI    $document_uri;
            fastcgi_param DOCUMENT_ROOT   $document_root;
            fastcgi_param SERVER_PROTOCOL $server_protocol;
            fastcgi_param GATEWAY_INTERFACE CGI/1.1;
            fastcgi_param SERVER_SOFTWARE nginx;
            fastcgi_param REMOTE_ADDR     $remote_addr;
            fastcgi_param REMOTE_PORT     $remote_port;
            fastcgi_param SERVER_ADDR     $server_addr;
            fastcgi_param SERVER_PORT     $server_port;
            fastcgi_param SERVER_NAME     $server_name;
            fastcgi_param HTTPS           on;
            fastcgi_keep_conn on;
            fastcgi_intercept_errors off;
        }

        location = /tsa/cert {
            alias /etc/tsa/certs/tsacert.pem;
            default_type application/x-x509-ca-cert;
        }

        location = /tsa/cacert {
            alias /etc/tsa/certs/cacert.pem;
            default_type application/x-x509-ca-cert;
        }

        location /api/ {
            proxy_pass http://tsa_demo;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }
    }
}
