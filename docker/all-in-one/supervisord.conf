; ============================================================
; All-in-One 进程托管
; chronyd → fcgiwrap → nginx → tsa-demo(原生二进制, 无 JVM)
; ============================================================

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; --- NTP ---
[program:chronyd]
command=/usr/sbin/chronyd -d -f /etc/chrony/chrony.conf
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/chronyd.out.log
stderr_logfile=/var/log/supervisor/chronyd.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

; --- RFC 3161 FastCGI (进程数 = CPU 核心数，适配 64 核 K8s 节点) ---
; K8s 多 Pod 方案更优：每 Pod -c 8，配合 HPA 弹性伸缩
; 单 Pod 方案：-c 32~64，根据实际 CPU 配额调整
[program:fcgiwrap]
command=/usr/bin/spawn-fcgi -a 127.0.0.1 -p 9000 -u fcgiwrap -g fcgiwrap -n -c 64 -- /usr/sbin/fcgiwrap
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/fcgiwrap.out.log
stderr_logfile=/var/log/supervisor/fcgiwrap.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

; --- HTTP/HTTPS (含 /api 反代到 tsa-demo) ---
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/nginx.out.log
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

; --- Java Demo 原生二进制 (GraalVM, 无 JVM) ---
; TSA_URL 指向容器内 nginx，形成完整闭环
[program:tsa-demo]
command=/usr/local/bin/tsa-demo
directory=/opt/tsa-demo
user=tsademo
autostart=true
autorestart=true
priority=40
startsecs=5
stdout_logfile=/var/log/supervisor/tsa-demo.out.log
stderr_logfile=/var/log/supervisor/tsa-demo.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
environment=TSA_URL="http://127.0.0.1/tsa",SERVER_PORT="9090",SPRING_CONFIG_ADDITIONAL_LOCATION="optional:file:/opt/tsa-demo/config/",TZ="Asia/Shanghai"
