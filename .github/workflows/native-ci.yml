# ============================================================
# 原生二进制 Artifact 构建 (可选)
# 生产发布以 Docker Build & Push → ghcr.io/.../tsa 为准
# （最终镜像已内嵌 tsa-demo 原生二进制，无需单独 tsa-demo 镜像）
# ============================================================
name: Native Binary CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - "sdk/**"
      - "sdk-demo/**"
      - "pom.xml"
      - ".github/workflows/native-ci.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "sdk/**"
      - "sdk-demo/**"
      - "pom.xml"
      - ".github/workflows/native-ci.yml"
  workflow_dispatch:

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native:
    name: Native binary ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: "graalvm-community"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Build native binary
        run: |
          mvn -B -f pom.xml -pl sdk -am clean install -DskipTests
          mvn -B -f pom.xml -pl sdk-demo -am -Pnative -DskipTests package
          test -x sdk-demo/target/tsa-demo
          ls -lh sdk-demo/target/tsa-demo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tsa-demo-linux-${{ matrix.arch }}
          path: sdk-demo/target/tsa-demo
          retention-days: 30

      - name: Note
        run: |
          {
            echo "## Native binary artifact only"
            echo ""
            echo "生产请使用最终镜像（内嵌此二进制）:"
            echo ""
            echo '```bash'
            echo "docker pull ghcr.io/xiaochen201807/shijianchuo/tsa:latest"
            echo '```'
            echo ""
            echo "单独 Artifact 仅供下载调试，不再推送独立 tsa-demo 镜像。"
          } >> "$GITHUB_STEP_SUMMARY"
