# ============================================================
# Java SDK 库编译 (仍为 jar，供其它 Java 项目依赖)
# Demo 原生二进制见 native-ci.yml
# ============================================================
name: Maven CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - "sdk/**"
      - "sdk-demo/**"
      - "pom.xml"
      - ".github/workflows/maven-ci.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "sdk/**"
      - "sdk-demo/**"
      - "pom.xml"
      - ".github/workflows/maven-ci.yml"
  workflow_dispatch:

concurrency:
  group: maven-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SDK library (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["21"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Maven install (SDK jar + demo jar 校验编译)
        run: mvn -B -f pom.xml clean install -DskipTests

      - name: Upload starter jar (library only)
        uses: actions/upload-artifact@v4
        with:
          name: tsa-spring-boot-starter-jdk${{ matrix.java }}
          path: sdk/target/tsa-spring-boot-starter-*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Job summary
        run: |
          {
            echo "## Maven CI"
            echo ""
            echo "- **SDK** (\`tsa-spring-boot-starter\`): 仍为 **JAR 库**，供其它 Java/Spring 项目依赖"
            echo "- **Demo 可执行程序**: 请使用 **Native Binary CI** 产出无 JVM 二进制 / 镜像"
            echo "- 构建命令: \`mvn -Pnative -DskipTests package\` → \`sdk-demo/target/tsa-demo\`"
          } >> "$GITHUB_STEP_SUMMARY"
