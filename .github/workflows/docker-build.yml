# ============================================================
# 最终镜像构建 (linux/amd64 + linux/arm64)
# 镜像: ghcr.io/<owner>/<repo>/tsa
# 内容: Tongsuo TSA + nginx + chrony + tsa-demo 原生二进制 (无 JVM)
# 构建: 多阶段 Dockerfile (GraalVM native → 运行时)
# ============================================================
name: Docker Build & Push

on:
  push:
    branches: [main, master, develop]
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - "docker/**"
      - "tsa-server/**"
      - "sdk/**"
      - "sdk-demo/**"
      - "pom.xml"
      - "docker-compose.yml"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "Dockerfile"
      - "docker/**"
      - "tsa-server/**"
      - "sdk/**"
      - "sdk-demo/**"
      - "pom.xml"
      - "docker-compose.yml"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:
    inputs:
      push_images:
        description: "是否推送到 GHCR（默认 true）"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # 单镜像名
  IMAGE_NAME: tsa

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      push: ${{ steps.meta.outputs.push }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Meta
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/${REPO}/${{ env.IMAGE_NAME }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

          PUSH="false"
          if [ "${{ github.event_name }}" = "push" ]; then
            PUSH="true"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.push_images }}" = "true" ]; then
            PUSH="true"
          fi
          echo "push=${PUSH}" >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE}"
          echo "Push:  ${PUSH}"
          echo "Arch:  linux/amd64 + linux/arm64"

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    # Tongsuo 编译 + GraalVM native-image，耗时较长
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Platform pair
        id: prep
        run: |
          echo "platform_pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: needs.prepare.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.image }}
          labels: |
            org.opencontainers.image.title=tsa-all-in-one
            org.opencontainers.image.description=RFC 3161 GM TSA (GmSSL3 + nginx + fcgiwrap + chrony)

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=RFC3161 GM TSA + native tsa-demo (no JVM)
          outputs: ${{ needs.prepare.outputs.push == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', needs.prepare.outputs.image) || 'type=cacheonly' }}
          cache-from: type=gha,scope=tsa-final-${{ steps.prep.outputs.platform_pair }}
          cache-to: type=gha,mode=max,scope=tsa-final-${{ steps.prep.outputs.platform_pair }}
          provenance: false
          sbom: false

      - name: Export digest
        if: needs.prepare.outputs.push == 'true'
        run: |
          mkdir -p /tmp/digests
          DIGEST="${{ steps.build.outputs.digest }}"
          test -n "$DIGEST"
          touch "/tmp/digests/${DIGEST#sha256:}"
          ls -la /tmp/digests

      - name: Upload digest
        if: needs.prepare.outputs.push == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-tsa-${{ steps.prep.outputs.platform_pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch
    needs: [prepare, build]
    if: needs.prepare.outputs.push == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-tsa-*
          path: /tmp/digests
          merge-multiple: true

      - name: List digests
        run: |
          ls -la /tmp/digests
          test "$(find /tmp/digests -type f | wc -l)" -ge 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=build-${{ github.run_number }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          IMAGE="${{ needs.prepare.outputs.image }}"
          DIGEST_REFS=()
          for f in *; do
            [ -f "$f" ] || continue
            DIGEST_REFS+=("${IMAGE}@sha256:${f}")
          done
          printf 'Refs:\n'; printf '  %s\n' "${DIGEST_REFS[@]}"

          TAG_ARGS=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            TAG_ARGS+=("-t" "${tag}")
          done <<< "${{ steps.meta.outputs.tags }}"

          docker buildx imagetools create "${TAG_ARGS[@]}" "${DIGEST_REFS[@]}"

      - name: Inspect
        run: |
          FIRST=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker buildx imagetools inspect "${FIRST}" || true
          {
            echo "## All-in-One multi-arch image"
            echo ""
            echo "- **Image**: \`${{ needs.prepare.outputs.image }}\`"
            echo "- **Platforms**: \`linux/amd64\`, \`linux/arm64\`"
            echo "- **Contains**: GmSSL3 + nginx + fcgiwrap + chrony"
            echo "- **Tags**:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo '```bash'
            echo "docker pull ${{ needs.prepare.outputs.image }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: Summary
    needs: [prepare, build, merge]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          {
            echo "## Docker All-in-One Build"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Image | \`${{ needs.prepare.outputs.image }}\` |"
            echo "| Platforms | amd64 + arm64 |"
            echo "| Push | \`${{ needs.prepare.outputs.push }}\` |"
            echo "| Build | \`${{ needs.build.result }}\` |"
            echo "| Merge | \`${{ needs.merge.result }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
