# ============================================================
# Docker 镜像构建 & 推送
# 组件: tsa-server (GmSSL3 + fcgiwrap) / nginx / chrony
# 仓库: ghcr.io/<owner>/<repo>/<image>
# ============================================================
name: Docker Build & Push

on:
  push:
    branches: [main, master, develop]
    tags: ["v*"]
    paths:
      - "tsa-server/**"
      - "nginx/**"
      - "chrony/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "tsa-server/**"
      - "nginx/**"
      - "chrony/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:
    inputs:
      push_images:
        description: "是否推送到 GHCR（默认 true）"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      image_filter:
        description: "仅构建指定镜像（all / tsa-server / nginx / chrony）"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - tsa-server
          - nginx
          - chrony

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # GHCR 要求镜像名全小写
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ------------------------------------------------------------
  # 准备镜像矩阵与是否推送
  # ------------------------------------------------------------
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      push: ${{ steps.meta.outputs.push }}
      image_prefix: ${{ steps.meta.outputs.image_prefix }}
    steps:
      - name: Normalize repository name (lowercase)
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          PREFIX="ghcr.io/${OWNER}/${REPO}"
          echo "image_prefix=${PREFIX}" >> "$GITHUB_OUTPUT"

          # PR 默认不推送；手动触发可覆盖；push/tag 推送
          PUSH="false"
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              if [ "${{ inputs.push_images }}" = "true" ]; then
                PUSH="true"
              fi
            else
              PUSH="true"
            fi
          fi
          echo "push=${PUSH}" >> "$GITHUB_OUTPUT"
          echo "Image prefix: ${PREFIX}"
          echo "Push images:  ${PUSH}"

      - name: Build matrix JSON
        id: set-matrix
        run: |
          FILTER="${{ inputs.image_filter || 'all' }}"
          # pull_request 没有 inputs，默认为 all
          if [ -z "$FILTER" ] || [ "$FILTER" = "null" ]; then
            FILTER="all"
          fi

          ALL='[
            {"name":"tsa-server","context":"./tsa-server","dockerfile":"./tsa-server/Dockerfile","timeout":90},
            {"name":"nginx","context":"./nginx","dockerfile":"./nginx/Dockerfile","timeout":30},
            {"name":"chrony","context":"./chrony","dockerfile":"./chrony/Dockerfile","timeout":20}
          ]'

          if [ "$FILTER" = "all" ]; then
            MATRIX="$ALL"
          else
            MATRIX=$(echo "$ALL" | jq -c --arg n "$FILTER" '[.[] | select(.name == $n)]')
            COUNT=$(echo "$MATRIX" | jq 'length')
            if [ "$COUNT" -eq 0 ]; then
              echo "Unknown image_filter: $FILTER" >&2
              exit 1
            fi
          fi

          # GitHub matrix 需要 { "include": [...] }
          OUTPUT=$(jq -c -n --argjson include "$MATRIX" '{include: $include}')
          echo "matrix=${OUTPUT}" >> "$GITHUB_OUTPUT"
          echo "Matrix: ${OUTPUT}"

  # ------------------------------------------------------------
  # 并行构建 / 推送各组件镜像
  # ------------------------------------------------------------
  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(matrix.timeout) }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: needs.prepare.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.image_prefix }}/${{ matrix.name }}
          tags: |
            # 默认分支 -> latest
            type=raw,value=latest,enable={{is_default_branch}}
            # 分支名
            type=ref,event=branch
            # PR
            type=ref,event=pr
            # semver: v1.2.3 -> 1.2.3 / 1.2 / 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # 短 SHA
            type=sha,prefix=sha-,format=short
            # 手动触发时额外打 build 标签
            type=raw,value=build-${{ github.run_number }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # 单架构优先保证稳定性；如需多架构可改为 linux/amd64,linux/arm64
          platforms: linux/amd64
          push: ${{ needs.prepare.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA 缓存加速（尤其 tsa-server 编译 GmSSL3）
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false
          sbom: false

      - name: Image digest
        if: needs.prepare.outputs.push == 'true'
        run: |
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image**: \`${{ needs.prepare.outputs.image_prefix }}/${{ matrix.name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Digest**: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tags**:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------
  # 汇总
  # ------------------------------------------------------------
  summary:
    name: Summary
    needs: [prepare, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        run: |
          {
            echo "## Docker Build Summary"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Event | \`${{ github.event_name }}\` |"
            echo "| Ref | \`${{ github.ref }}\` |"
            echo "| Push to GHCR | \`${{ needs.prepare.outputs.push }}\` |"
            echo "| Image prefix | \`${{ needs.prepare.outputs.image_prefix }}\` |"
            echo "| Build result | \`${{ needs.build.result }}\` |"
            echo ""
            echo "### Pull examples"
            echo '```bash'
            echo "docker pull ${{ needs.prepare.outputs.image_prefix }}/tsa-server:latest"
            echo "docker pull ${{ needs.prepare.outputs.image_prefix }}/nginx:latest"
            echo "docker pull ${{ needs.prepare.outputs.image_prefix }}/chrony:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
