# ============================================================
# TSA Demo Application 配置
# ============================================================

server:
  port: 9090
  servlet:
    context-path: /
  tomcat:
    max-keep-alive-requests: -1
    keep-alive-timeout: 60000

spring:
  application:
    name: tsa-demo

# TSA SDK 配置 (需显式启用)
# 环境变量覆盖示例: TSA_URL=http://192.168.1.10:8080/tsa
tsa:
  enabled: true   # 显式启用 SDK (默认 false, 不配置此项则 SDK 不加载)
  url: ${TSA_URL:http://127.0.0.1:9001/tsa}
  connect-timeout: ${TSA_CONNECT_TIMEOUT:5000}
  read-timeout: ${TSA_READ_TIMEOUT:30000}
  policy-oid: ${TSA_POLICY_OID:1.2.3.4.1}
  cert-req: true
  hash-algorithm: SM3
  auto-register-provider: true
  # GoFastDFS 文件存储服务地址 (远端文件下载前缀, IP+端口)
  # 用于 TsaClient.timestampRemoteFile / verifyRemoteFile
  # 实际下载地址 = gofastdfs-store + 传入的 filePath 参数
  gofastdfs-store: ${GOFASTDFS_STORE_URL:http://127.0.0.1:8080}

# 日志配置
logging:
  level:
    com.tsa: WARN
    org.springframework.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
