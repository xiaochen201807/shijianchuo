# ============================================================
# TSA Demo Application 配置
# ============================================================

server:
  port: 9090
  servlet:
    context-path: /
  tomcat:
    threads:
      max: 400
      min-spare: 50
    accept-count: 200
    max-connections: 8192

spring:
  application:
    name: tsa-demo

# TSA SDK 配置
# 环境变量覆盖示例: TSA_URL=http://192.168.1.10:8080/tsa
tsa:
  url: ${TSA_URL:http://127.0.0.1:9001/tsa}
  connect-timeout: ${TSA_CONNECT_TIMEOUT:5000}
  read-timeout: ${TSA_READ_TIMEOUT:30000}
  policy-oid: ${TSA_POLICY_OID:1.2.3.4.1}
  cert-req: true
  hash-algorithm: SM3
  auto-register-provider: true

# 日志配置
logging:
  level:
    com.tsa: INFO
    org.springframework.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
