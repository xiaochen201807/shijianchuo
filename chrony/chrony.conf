# ============================================================
# Chrony NTP 配置
# 使用国内 NTP 服务器确保时间精确
# ============================================================

# --- NTP 上游服务器 ---
# 阿里云 NTP
server ntp.aliyun.com iburst minpoll 4 maxpoll 10
# 腾讯云 NTP
server ntp.tencent.com iburst minpoll 4 maxpoll 10
# 中国 NTP Pool
server cn.pool.ntp.org iburst minpoll 4 maxpoll 10

# --- 基础设置 ---
# 允许系统时钟在启动时大幅跳跃
makestep 1.0 3

# 如果时钟偏移大于 1 秒，允许前 3 次直接跳步
# rtcsync: 自动同步内核 RTC
rtcsync

# --- 漂移文件 ---
driftfile /var/lib/chrony/drift

# --- 日志设置 ---
logdir /var/log/chrony
log measurements statistics tracking

# --- 允许网络内客户端同步 ---
# 允许 Docker 网络内的容器查询
allow 172.28.0.0/16
allow 127.0.0.1

# --- 本地时钟作为备用 ---
# 如果所有上游都不可用，以本地时钟为准
local stratum 10

# --- 性能优化 ---
# 最大更新频率
maxupdateskew 100.0

# 硬件时间戳
# hardwaretimeformat

# --- 安全设置 ---
# 仅允许查询时间，不允许远程配置
cmdport 0
